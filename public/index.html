<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopify Review Scraper</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <div class="header">
          <div>
            <p class="eyebrow">Review scraper</p>
            <h1>Shopify Product Reviews</h1>
            <p class="subhead">Paste a product page URL, choose a limit, and export the reviews you find.</p>
          </div>
          <div class="status" id="status">Ready</div>
        </div>

        <section class="tool-panel">
          <form id="scrape-form" class="url-form">
            <label for="product-url">Product URL</label>
            <div class="input-row">
              <input
                id="product-url"
                name="url"
                type="url"
                placeholder="https://store.com/products/product-name"
                autocomplete="url"
                required
              />
              <select id="max-reviews" name="maxReviews" aria-label="Maximum reviews">
                <option value="25">25 reviews</option>
                <option value="50">50 reviews</option>
                <option value="100">100 reviews</option>
                <option value="250">250 reviews</option>
              </select>
              <button type="submit">Scrape</button>
            </div>
          </form>
        </section>

        <section class="summary" id="summary" hidden>
          <div>
            <span class="metric" id="review-count">0</span>
            <span class="metric-label">reviews found</span>
          </div>
          <div>
            <span class="metric" id="duration">0s</span>
            <span class="metric-label">runtime</span>
          </div>
          <div class="export-actions">
            <button id="download-csv" type="button">Export CSV</button>
            <button id="download-json" type="button" class="secondary-button">JSON</button>
          </div>
        </section>

        <section class="results" id="results" aria-live="polite"></section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
